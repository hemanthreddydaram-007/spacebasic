name: SpaceBasic Daily Meal RSVP Automation

on:
  schedule:
    # Runs daily at 02:30 UTC = 08:00 AM IST
    - cron: '30 2 * * *'
  workflow_dispatch: # Allows manual run button in Actions tab

jobs:
  auto-rsvp:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run SpaceBasic RSVP Script
        env:
          SPACEBASIC_TOKEN: ${{ secrets.SPACEBASIC_TOKEN }}
        run: python main.py
