name: Automated Mess Booking

on:
  schedule:
    # Target 1: 8:10 AM IST (2:40 AM UTC) - Primary target
    - cron: '40 2 * * *'
    
    # Target 2: 8:15 AM IST (2:45 AM UTC) - Backup target
    - cron: '45 2 * * *'
    
    # Target 3: 8:20 AM IST (2:50 AM UTC) - Safety backup
    - cron: '50 2 * * *'

  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

jobs:
  run-booking:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytz supabase

      - name: Run booking script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python main.py
