name: Automated Mess Booking

on:
  schedule:
    # Target 1: 7:00 AM IST (1:30 AM UTC) - Primary target
    - cron: '30 1 * * *'
    
    # Target 2: 7:05 AM IST (1:35 AM UTC) - Backup target
    - cron: '35 1 * * *'
    
    # Target 3: 7:10 AM IST (1:40 AM UTC) - Safety backup
    - cron: '40 1 * * *'

  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

jobs:
  run-booking:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytz supabase cryptography

      - name: Run automated mess booking
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: python main.py
