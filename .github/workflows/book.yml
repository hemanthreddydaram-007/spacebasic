name: SpaceBasic Daily Autopilot Booking

on:
  schedule:
    # 02:30 UTC = 08:00 AM IST
    - cron: '30 2 * * *'
    # 08:00 UTC = 01:30 PM IST
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  run-autopilot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        # Pinned to full immutable commit SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.10
        # Pinned to full immutable commit SHA
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Execute Daily Meal Booking Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SECRET_KEY: ${{ secrets.SECRET_KEY || secrets.ENCRYPTION_KEY }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY || secrets.SECRET_KEY }}
          ALERT_SENDER_EMAIL: ${{ secrets.ALERT_SENDER_EMAIL }}
          ALERT_SENDER_PASSWORD: ${{ secrets.ALERT_SENDER_PASSWORD }}
        run: |
          python main.py
