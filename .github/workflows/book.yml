name: Automated Mess Booking

on:
  schedule:
    # 05:16 UTC = 10:46 AM IST (30 minutes from now)
    - cron: '16 5 * * *'
  workflow_dispatch:

jobs:
  run-booking:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests pytz

      - name: Run booking script
        env:
          SPACEBASIC_TOKEN: ${{ secrets.SPACEBASIC_TOKEN }}
        run: python main.py
