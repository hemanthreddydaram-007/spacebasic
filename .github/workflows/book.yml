name: Automated Mess Booking

on:
  schedule:
    # Target 1: 4:55 PM IST (11:25 AM UTC) - Early check
    - cron: '25 11 * * *'
    
    # Target 2: 5:00 PM IST (11:30 AM UTC) - Primary target
    - cron: '30 11 * * *'
    
    # Target 3: 5:05 PM IST (11:35 AM UTC) - Safety backup
    - cron: '35 11 * * *'

  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

jobs:
  run-booking:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytz supabase

      - name: Run booking script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python main.py
