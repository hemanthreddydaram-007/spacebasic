<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DHR AutoBook</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0e1117;
            color: #ffffff;
            display: flex;
            flex-direction: column;
        }

        .guide-banner {
            background-color: #161b22;
            border-bottom: 1px solid #30363d;
            padding: 12px 20px;
        }

        details {
            max-width: 900px;
            margin: 0 auto;
        }

        summary {
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            color: #58a6ff;
            user-select: none;
            outline: none;
        }

        summary:hover {
            color: #79c0ff;
        }

        .video-wrapper {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid #21262d;
            text-align: center;
        }

        video {
            width: 100%;
            max-width: 720px;
            max-height: 360px;
            border-radius: 8px;
            border: 1px solid #30363d;
            outline: none;
            background-color: #000000;
        }

        iframe {
            flex-grow: 1;
            width: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="guide-banner">
        <details open>
            <summary>📺 Video Guide: How to Get User ID & Authorization Token (Click to toggle)</summary>
            <div class="video-wrapper">
                <video controls preload="metadata">
                    <source src="Screen Recording 2026-08-08 151423.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>
        </details>
    </div>

    <!-- Embedded Streamlit Application -->
    <iframe src="https://autobook.streamlit.app/?embed=true"></iframe>

</body>
</html>
